<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#161530"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.18); opacity: 0.95; }
      }
      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes counterSpin {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes textShimmer {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .bg-glow {
        animation: pulse 5s ease-in-out infinite;
        transform-origin: 220px 210px;
      }
      .floating-emblem {
        animation: floatEffect 4s ease-in-out infinite;
      }
      .orbit-ring {
        animation: spinOrbit 14s linear infinite;
        transform-origin: 220px 210px;
      }
      .orbit-ring-reverse {
        animation: counterSpin 20s linear infinite;
        transform-origin: 220px 210px;
      }
      .title-text {
        font-family: 'DM Sans', 'Inter', -apple-system, system-ui, sans-serif;
        font-weight: 850;
        letter-spacing: -0.03em;
        animation: textShimmer 3s ease-in-out infinite;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .tag-text {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1198" height="418" x="1" y="1" rx="19" fill="none" stroke="#2a2c4e" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Background Decorative Grid Grid Dots -->
  <g opacity="0.12" fill="#818cf8">
    <circle cx="650" cy="60" r="1.5"/><circle cx="700" cy="60" r="1.5"/><circle cx="750" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/><circle cx="850" cy="60" r="1.5"/><circle cx="900" cy="60" r="1.5"/><circle cx="950" cy="60" r="1.5"/><circle cx="1000" cy="60" r="1.5"/><circle cx="1050" cy="60" r="1.5"/><circle cx="1100" cy="60" r="1.5"/>
    <circle cx="650" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/><circle cx="750" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="850" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/><circle cx="950" cy="100" r="1.5"/><circle cx="1000" cy="100" r="1.5"/><circle cx="1050" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/>
    <circle cx="650" cy="140" r="1.5"/><circle cx="700" cy="140" r="1.5"/><circle cx="750" cy="140" r="1.5"/><circle cx="800" cy="140" r="1.5"/><circle cx="850" cy="140" r="1.5"/><circle cx="900" cy="140" r="1.5"/><circle cx="950" cy="140" r="1.5"/><circle cx="1000" cy="140" r="1.5"/><circle cx="1050" cy="140" r="1.5"/><circle cx="1100" cy="140" r="1.5"/>
  </g>

  <!-- Left Hero: Radial Glow Field -->
  <circle cx="220" cy="210" r="160" fill="url(#starGlow)" class="bg-glow"/>

  <!-- Left Hero: Animated Orbit Rings -->
  <g class="orbit-ring">
    <ellipse cx="220" cy="210" rx="125" ry="55" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="345" cy="210" r="4.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
    <circle cx="95" cy="210" r="3.5" fill="#a855f7"/>
  </g>

  <g class="orbit-ring-reverse">
    <ellipse cx="220" cy="210" rx="100" ry="90" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="5 5"/>
    <circle cx="220" cy="120" r="4" fill="#c084fc" filter="drop-shadow(0 0 5px #c084fc)"/>
  </g>

  <!-- Left Hero: Floating Idraak Central Cognition Emblem -->
  <g class="floating-emblem">
    <!-- Outer Insight Diamond -->
    <path d="M220 95 L242 180 L325 210 L242 240 L220 325 L198 240 L115 210 L198 180 Z"
          fill="url(#emblemGrad)"
          filter="drop-shadow(0 12px 28px rgba(124, 58, 237, 0.45))"/>

    <!-- Inner Core Spark -->
    <path d="M220 145 L232 195 L280 210 L232 225 L220 275 L208 225 L160 210 L208 195 Z"
          fill="#ffffff"
          opacity="0.92"/>

    <!-- Core Center Dot -->
    <circle cx="220" cy="210" r="6" fill="#f8fafc" filter="drop-shadow(0 0 8px #ffffff)"/>
  </g>

  <!-- Right Hero: Text & Hierarchy -->
  <!-- Urdu/Arabic Calligraphic Root Badge -->
  <g transform="translate(480, 75)">
    <rect width="210" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-opacity="0.4"/>
    <text x="18" y="21" fill="#c7d2fe" font-size="13" class="tag-text">ادراک • COGNITION &amp; INSIGHT</text>
  </g>

  <!-- Main Headline Title -->
  <text x="480" y="170" fill="url(#textGrad)" font-size="58" class="title-text">
    Idraak <tspan fill="#818cf8">AI</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="480" y="215" fill="#94a3b8" font-size="18" class="sub-text">
    Enterprise Document Cognition &amp; Hybrid RAG Engine
  </text>

  <text x="480" y="245" fill="#64748b" font-size="14.5" class="sub-text">
    Grounded Vector Search • Fine-Grained Knowledge Scopes • Secure RBAC
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(480, 285)">
    <!-- Pill 1: Qdrant Vector DB -->
    <g transform="translate(0, 0)">
      <rect width="140" height="36" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
      <text x="34" y="23" fill="#e0e7ff" font-size="12.5" class="sub-text">Qdrant Vector DB</text>
    </g>

    <!-- Pill 2: Hybrid RAG -->
    <g transform="translate(152, 0)">
      <rect width="130" height="36" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#a855f7"/>
      <text x="34" y="23" fill="#e0e7ff" font-size="12.5" class="sub-text">Hybrid RAG</text>
    </g>

    <!-- Pill 3: NestJS + FastAPI -->
    <g transform="translate(294, 0)">
      <rect width="150" height="36" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#34d399"/>
      <text x="34" y="23" fill="#e0e7ff" font-size="12.5" class="sub-text">Dual Microservices</text>
    </g>

    <!-- Pill 4: RBAC & Multi-Tenant -->
    <g transform="translate(456, 0)">
      <rect width="158" height="36" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#f43f5e"/>
      <text x="34" y="23" fill="#e0e7ff" font-size="12.5" class="sub-text">Isolated Multi-Tenant</text>
    </g>
  </g>
</svg>
